[package]
name = "orbit-code"
version = "0.2.0"
description = "Orbit Code desktop shell"
authors = ["Orbit Code"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "orbit_code_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
